# OAI gNB — band 78, 106 PRB (40 MHz), numerology 1, SA, RF simulator.
# Based on OAI's tested reference conf
# (ci-scripts/conf_files/gnb.sa.band78.106prb.rfsim.conf), adapted for this lab:
#   - PLMN 001/01, single slice SST=1 (matches Open5GS + subscribers)
#   - AMF N2 = 192.168.70.13, gNB NGU/NGC = 192.168.70.30
#   - rfsimulator in server mode (UEs connect in over TCP 4043)

Active_gNBs = ( "gnb-rfsim");
Asn1_verbosity = "none";

gNBs =
(
 {
    gNB_ID = 0xe00;
    gNB_name  =  "gnb-rfsim";
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 1; mnc = 1; mnc_length = 2; snssaiList = ({ sst = 1 }) });
    nr_cellid = 12345678L

    ////////// Physical parameters:
    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;

      absoluteFrequencySSB                                          = 621312;
      dl_absoluteFrequencyPointA                                       = 620040;
      dl_offstToCarrier                                              = 0;
      dl_subcarrierSpacing                                           = 1;
      dl_carrierBandwidth                                            = 106;
      initialDLBWPlocationAndBandwidth                                        = 28875;
      initialDLBWPsubcarrierSpacing                                           = 1;
      initialDLBWPcontrolResourceSetZero                                      = 11;
      initialDLBWPsearchSpaceZero                                             = 0;

      ul_frequencyBand                                                 = 78;
      ul_offstToCarrier                                              = 0;
      ul_subcarrierSpacing                                           = 1;
      ul_carrierBandwidth                                            = 106;
      pMax                                                          = 20;
      initialULBWPlocationAndBandwidth                                        = 28875;
      initialULBWPsubcarrierSpacing                                           = 1;
      prach_ConfigurationIndex                                  = 98;
      prach_msg1_FDM                                            = 0;
      prach_msg1_FrequencyStart                                 = 0;
      zeroCorrelationZoneConfig                                 = 12;
      preambleReceivedTargetPower                               = -104;
      preambleTransMax                                          = 6;
      powerRampingStep                                            = 1;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;
      ra_ContentionResolutionTimer                                = 7;
      rsrp_ThresholdSSB                                           = 19;
      prach_RootSequenceIndex_PR                                  = 2;
      prach_RootSequenceIndex                                     = 1;
      msg1_SubcarrierSpacing                                      = 1,
      restrictedSetConfig                                         = 0,

      msg3_DeltaPreamble                                          = 1;
      p0_NominalWithGrant                                         =-90;

      pucchGroupHopping                                           = 0;
      hoppingId                                                   = 40;
      p0_nominal                                                  = -90;

      ssb_PositionsInBurst_Bitmap                                   = 1;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;

      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = -25;
  }

  );

    # ------- SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.70.13"; });

    NETWORK_INTERFACES :
    {
       GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.70.30";
       GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.70.30";
       GNB_PORT_FOR_S1U                         = 2152;
    };
  }
);

MACRLCs = (
  {
    tr_s_preference  = "local_L1";
    tr_n_preference  = "local_RRC";
    pusch_TargetSNRx10 = 200;
    pucch_TargetSNRx10 = 200;
  }
);

L1s = (
{
  tr_n_preference = "local_mac";
  prach_dtx_threshold = 200;
}
);

RUs = (
    {
       local_rf       = "yes"
         nb_tx          = 1
         nb_rx          = 1
         att_tx         = 0
         att_rx         = 0;
         bands          = [78];
         max_pdschReferenceSignalPower = -27;
         max_rxgain                    = 75;
         eNB_instances  = [0];
         sf_extension = 0
    }
);

rfsimulator = (
  {
    serveraddr = "server";
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level  = "info";
  hw_log_level      = "info";
  phy_log_level     = "info";
  mac_log_level     = "info";
  rlc_log_level     = "info";
  pdcp_log_level    = "info";
  rrc_log_level     = "info";
  ngap_log_level    = "debug";
};
