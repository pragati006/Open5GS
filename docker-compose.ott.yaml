# OTT SIP voice service overlay — run on top of the base 5G stack.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.ott.yaml up -d
#
# Services added:
#   kamailio   – SIP registrar + proxy (data net 10.100.0.10)
#   rtpengine  – RTP media relay     (data net 10.100.0.11)
#   phone-ue2 (caller)  = your laptop MIC  -> 5G/UPF -> RTPengine ->
#   phone-ue1 (callee)  = auto-answers, plays received audio to the laptop SPEAKER
# So you speak and hear your own voice come out the speaker, carried live over 5G. 
name: open5gs-oai-5g

services:

  # ---------------------------------------------------------- Kamailio
  kamailio:
    build: ./voip/kamailio
    image: kamailio-ott:local
    container_name: kamailio
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    volumes:
      - ./voip/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    networks:
      datanet:
        ipv4_address: 10.100.0.10
    healthcheck:
      test: ["CMD", "nc", "-zu", "10.100.0.10", "5060"]
      interval: 5s
      retries: 12
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Inject the return routing pathway through the network interface
        ip route add 10.45.0.0/24 via 10.100.0.1
        
        # Execute the original Kamailio engine process cleanly in the foreground
        exec kamailio -DD -E


  # -------------------------------------------------------- RTPengine
  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: rtpengine
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_NICE]
    networks:
      datanet:
        ipv4_address: 10.100.0.11
    # Bypass the image entrypoint (it sed-edits a config file). Run rtpengine
    # directly in pure userspace mode (--table=-1 => no kernel module, works in WSL).
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PATH=/usr/local/bin:/usr/bin:/usr/sbin:$$PATH
        exec rtpengine \
          --table=-1 \
          --interface=10.100.0.11 \
          --listen-ng=10.100.0.11:22222 \
          --port-min=30000 --port-max=31000 \
          --log-level=6 --log-stderr=true --foreground
    depends_on:
      kamailio:
        condition: service_started

  phone-ue1:
    build: ./voip/linphone
    image: linphone-ott:local
    container_name: phone-ue1
    restart: "no"
    cap_add: [NET_ADMIN, NET_RAW]
    network_mode: "container:oai-nr-ue-1"
    depends_on:
      kamailio:
        condition: service_healthy
      oai-nr-ue-1:
        condition: service_started
    entrypoint: ["bash", "/run-linphone2.sh"]
    environment:
      SIP_USER: ue1
      SIP_PASS: secret1
      SIP_DOMAIN: "10.100.0.10"
      UE_IFACE: oaitun_ue1
      PEER_URI: ""
      AUTO_ANSWER: "yes"
      CAPTURE_DEV: "PulseAudio: default"
      PLAYBACK_DEV: "PulseAudio: default"
      PULSE_SERVER: "unix:/mnt/wslg/PulseServer"
    volumes:
      - /mnt/wslg:/mnt/wslg
      - ./voip/linphone/run-linphone2.sh:/run-linphone2.sh:ro

  phone-ue2:
    build: ./voip/linphone
    image: linphone-ott:local
    container_name: phone-ue2
    restart: "no"
    cap_add: [NET_ADMIN, NET_RAW]
    network_mode: "container:oai-nr-ue-2"
    depends_on:
      kamailio:
        condition: service_healthy
      oai-nr-ue-2:
        condition: service_started
    entrypoint: ["bash", "/run-linphone2.sh"]
    environment:
      SIP_USER: ue2
      SIP_PASS: secret2
      SIP_DOMAIN: "10.100.0.10"
      UE_IFACE: oaitun_ue1
      PEER_URI: ""
      AUTO_ANSWER: "no"
      CAPTURE_DEV: "PulseAudio: default"
      PLAYBACK_DEV: "PulseAudio: default"
      PULSE_SERVER: "unix:/mnt/wslg/PulseServer"
    volumes:
      - /mnt/wslg:/mnt/wslg
      - ./voip/linphone/run-linphone2.sh:/run-linphone2.sh:ro

networks:
  datanet:
    external: true
    name: o5gs-datanet

    
