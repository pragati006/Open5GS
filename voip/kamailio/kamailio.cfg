#!KAMAILIO
#
# OTT SIP over 5G data plane
# Role: SIP registrar + proxy, with RTPengine media steering.
#
# Network layout:
#   Kamailio listens on 10.100.0.10:5060 (data net)
#   RTPengine listens on 10.100.0.11 (data net), NG ctrl port 22222
#   UE1 baresip: registers from 10.45.0.x (behind UPF NAT on the data net = 10.100.0.2)
#   UE2 baresip: same

####### Global Parameters #########

debug=3
log_stderror=yes
memdbg=5
memlog=5
log_facility=LOG_LOCAL0

fork=yes
children=4

# Listen on the data-network interface
listen=udp:10.100.0.10:5060
listen=udp:0.0.0.0:5060

mhomed=1
alias="kamailio"

####### Modules Section ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "rtpengine.so"
loadmodule "nathelper.so"

# ----- rr params -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# ----- usrloc params -----
modparam("usrloc", "db_mode", 0)

# ----- registrar params -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "gruu_enabled", 0)
modparam("registrar", "received_avp", "$avp(RECEIVED)")

# ----- nathelper: received_avp MUST match registrar's -----
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

# ----- rtpengine params -----
# set_id=0  map to rtpengine at 10.100.0.11:22222
modparam("rtpengine", "rtpengine_sock", "udp:10.100.0.11:22222")
modparam("rtpengine", "rtpengine_tout_ms", 1000)

# ----- nathelper params -----
modparam("nathelper", "natping_interval", 0)
modparam("nathelper", "sipping_bflag", -1)

####### Routing Logic ########

request_route {

    # per-request initial checks
    route(REQINIT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }

    # handle retransmissions
    if (!is_method("ACK")) {
        if(t_precheck_trans()) { t_check_trans(); exit; }
        t_check_trans();
    }

    # record-route for all dialog-forming requests
    if (!is_method("REGISTER|MESSAGE")) { record_route(); }

    # handle requests within dialogs
    route(WITHINDLG);

    # only initial requests below
    # handle registration
    route(REGISTRAR);

    # user location service
    route(LOCATION);
}

route[REQINIT] {
    if (!sanity_check("1511", "7")) {
        xlog("Malformed SIP message from $si:$sp\n");
        exit;
    }
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
}

route[WITHINDLG] {
    if (!has_totag()) return;

    if (loose_route()) {
        route(RELAY);
        exit;
    }
    if (is_method("SUBSCRIBE|NOTIFY|PUBLISH")) {
        sl_send_reply("404", "No dialog");
        exit;
    }
    if (is_method("ACK")) { exit; }
    sl_send_reply("404", "Not here");
    exit;
}

route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    # UEs are always behind the UPF masquerade NAT: store the received socket
    # so we can route calls back to them.
    if (nat_uac_test("19")) {
        fix_nated_register();
    }

    if (!save("location")) {
        sl_reply_error();
    }
    xlog("L_INFO", "REGISTER $fu from $si:$sp saved (contact $ct)\n");
    exit;
}

route[LOCATION] {
    if (!lookup("location")) {
        $var(rc) = $rc;
        if ($var(rc) == -1 || $var(rc) == -3) {
            t_newtran();
            t_reply("404", "Not Found");
            exit;
        }
        if ($var(rc) == -2) {
            sl_send_reply("405", "Not Allowed");
            exit;
        }
    }
    route(RELAY);
}

route[RELAY] {
    # For INVITEs: steer media through RTPengine
    if (is_method("INVITE")) {
        rtpengine_manage("replace-origin replace-session-connection");
    }
    # For BYE / ACK on relayed calls
    if (is_method("BYE")) {
        rtpengine_manage("remove");
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    # fix SDP answer on provisional / 200 OK, and steer media through RTPengine
    if (status=~"(18[0-9]|2[0-9][0-9])") {
        if (nat_uac_test("18")) {
            fix_nated_contact();
        }
        if (has_body("application/sdp")) {
            rtpengine_manage("replace-origin replace-session-connection");
        }
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) exit;
}
